# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: 'exodus_of_Natural-intuition'
baseURL: 'https://example.com/' # Website URL

############################
## PAGE OPTIONS
############################

cascade:
  # Blog post options
  - target:.
├── config/_default/          Hugo configuration (hugo.yaml, languages, menus, params)
├── content/
│   ├── _index.md             Main landing page with all sections (hero, pricing, FAQs)
│   ├── authors/              Author profiles
│   ├── blog/                 Blog posts (empty in template)
│   ├── changelog/            Changelog entries (empty in template)
│   ├── privacy.md            Privacy policy
│   └── terms.md              Terms of service
├── data/                     Data files for dynamic content
├── assets/                   Static assets (images, CSS, JS)
├── .github/workflows/
│   ├── build.yml             Builds site with Hugo + Tailwind + Pagefind
│   ├── deploy.yml            Deploys to GitHub Pages
│   └── upgrade.yml           Updates HugoBlox dependencies
├── package.json              Node dependencies (pnpm, Tailwind, Pagefind)
├── go.mod                    Hugo module dependencies
├── hugoblox.yaml             Template metadata (Hugo version, deployment target)
├── netlify.toml              Netlify build config (alternative host)
└── theme.toml                Theme metadata
      path: /blog/**
      kind: page
    pager: true
    editable: true
    show_date: true
    show_date_updated: true
    reading_time: true
    commentable: true
    show_related: true
    share: true
    # Just use Breadcrumb for navigation on blog post pages?
    show_breadcrumb: false
    header:New_City
      navbar:true
        enable: true
  # Blog section options
  - target:
      path: /blog/*
      kind: section
    # Set the listing view
    view: 202609-05-linear-ontology

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputs:deployment
  home: [HTML, RSS, headers, redirects]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  author: Michael_Hall
markup:markup language
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep
